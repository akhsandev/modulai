<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ekspedisi Taman Sains Newton: Dinamika Gerak 3D & WebVR</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #A8DADC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Layar Pembuka / Start Overlay */
    #start-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(43, 64, 48, 0.65) url('./assets/cover.png') center/cover no-repeat;
      backdrop-filter: blur(4px);
      padding: 16px;
    }

    .start-card {
      background: #FBF6EA;
      border: 4px solid #D49A3D;
      border-radius: 20px;
      padding: 28px 24px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .start-card h1 {
      color: #2F5233;
      font-size: 26px;
      margin-bottom: 8px;
    }
    .start-card .subtitle {
      color: #8C5835;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .start-card p {
      color: #3C3633;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .btn-main {
      display: block;
      width: 100%;
      background: #E9B44C;
      color: #2F5233;
      border: 2px solid #D49A3D;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      margin-bottom: 12px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(212, 154, 61, 0.3);
    }
    .btn-main:hover {
      background: #FFD166;
      transform: translateY(-2px);
    }
    .btn-main:active {
      transform: translateY(1px);
    }

    .btn-vr {
      display: none;
      background: #457B9D;
      color: #FBF6EA;
      border: 2px solid #1D3557;
    }
    .btn-vr:hover {
      background: #A8DADC;
      color: #1D3557;
    }

    .vr-status-text {
      font-size: 12px;
      color: #6B4226;
      margin-top: 8px;
    }

    /* Minimal HUD (Hanya aktif saat gameplay di luar VR) */
    #hud {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 5;
      display: none;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .hud-group {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    .hud-btn {
      background: rgba(251, 246, 234, 0.92);
      border: 2px solid #D49A3D;
      color: #2F5233;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      transition: all 0.15s ease;
    }
    .hud-btn:hover {
      background: #FFD166;
      transform: scale(1.04);
    }
    .hud-btn:active {
      transform: scale(0.96);
    }

    /* Responsive mobile */
    @media (max-width: 600px) {
      .start-card h1 {
        font-size: 22px;
      }
      .start-card {
        padding: 20px 16px;
      }
      .hud-btn {
        padding: 6px 10px;
        font-size: 11px;
      }
    }
  </style>
  <script type="module" crossorigin src="./assets/index-DDqhEkTB.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Layar Pembuka -->
  <div id="start-overlay">
    <div class="start-card">
      <div class="subtitle">Fisika Dinamika SMA Kelas 10</div>
      <h1>Ekspedisi Taman Sains Newton</h1>
      <p>
        Buktikan kebenaran Hukum I (Inersia), Hukum II (F = m·a), dan Hukum III (Aksi-Reaksi) melalui eksperimen variabel diorama 3D interaktif.
      </p>
      <button id="start-btn" class="btn-main">🚀 Mulai Ekspedisi Sains</button>
      <button id="vr-button" class="btn-main btn-vr">🥽 Masuk Mode WebXR VR</button>
      <div id="vr-status" class="vr-status-text">Memeriksa dukungan WebXR...</div>
    </div>
  </div>

  <!-- Gameplay HUD (Pintasan cepat) -->
  <div id="hud">
    <div class="hud-group">
      <button class="hud-btn" data-target="hub">🏛 Taman Hub</button>
      <button class="hud-btn" data-target="station_1">❄ Inersia</button>
      <button class="hud-btn" data-target="station_2">⚙ Dinamika</button>
      <button class="hud-btn" data-target="station_3">🚀 Aksi-Reaksi</button>
    </div>
    <div class="hud-group">
      <button id="mute-btn" class="hud-btn">🔊 Audio Hidup</button>
    </div>
  </div>

</body>
</html>
