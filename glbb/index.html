<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi GLBB - Gerak Lurus Berubah Beraturan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .sidebar {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            background: linear-gradient(45deg, #00d4ff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 20px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #ccc;
        }

        .control-group label span {
            color: #00d4ff;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            background: rgba(0, 212, 255, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(45deg, #00d4ff, #ff00ff);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(45deg, #00d4ff, #ff00ff);
            cursor: pointer;
            border: none;
        }

        .info-box {
            background: rgba(0, 212, 255, 0.1);
            border-left: 3px solid #00d4ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .info-box h3 {
            font-size: 0.9rem;
            margin-bottom: 10px;
            color: #00d4ff;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 6px;
            font-family: 'Courier New', monospace;
        }

        .info-item .value {
            color: #ff00ff;
            font-weight: bold;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: all 0.3s;
            color: white;
        }

        .btn-play {
            background: linear-gradient(45deg, #00d4ff, #0099cc);
        }

        .btn-pause {
            background: linear-gradient(45deg, #ffaa00, #ff6600);
        }

        .btn-reset {
            background: linear-gradient(45deg, #ff00ff, #cc00cc);
        }

        .btn-preset {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .scene-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            position: relative;
        }

        #three-canvas {
            width: 100%;
            height: 450px;
            display: block;
        }

        .graph-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .graph-container h3 {
            margin-bottom: 10px;
            color: #00d4ff;
            font-size: 1rem;
        }

        .graph-container canvas {
            width: 100%;
            height: 250px;
            display: block;
        }

        .legend {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            font-size: 0.85rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }

        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }
            .sidebar {
                position: static;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h1>⚡ Simulasi GLBB</h1>
            <p class="subtitle">Gerak Lurus Berubah Beraturan</p>

            <div class="info-box">
                <h3>📊 Data Saat Ini</h3>
                <div class="info-item">
                    <span>Waktu (t):</span>
                    <span class="value" id="info-t">0.0 s</span>
                </div>
                <div class="info-item">
                    <span>Posisi (s):</span>
                    <span class="value" id="info-s">0.0 m</span>
                </div>
                <div class="info-item">
                    <span>Kecepatan (v):</span>
                    <span class="value" id="info-v">0.0 m/s</span>
                </div>
            </div>

            <div class="control-group">
                <label>Kecepatan Awal (v₀) <span id="val-v0">10</span> m/s</label>
                <input type="range" id="slider-v0" min="-20" max="20" step="0.5" value="10">
            </div>

            <div class="control-group">
                <label>Percepatan (a) <span id="val-a">2</span> m/s²</label>
                <input type="range" id="slider-a" min="-5" max="5" step="0.1" value="2">
            </div>

            <div class="control-group">
                <label>Waktu Simulasi (T) <span id="val-T">10</span> s</label>
                <input type="range" id="slider-T" min="1" max="30" step="1" value="10">
            </div>

            <div class="btn-group">
                <button class="btn-play" id="btn-play">▶ Play</button>
                <button class="btn-pause" id="btn-pause">⏸ Pause</button>
                <button class="btn-reset" id="btn-reset">↻ Reset</button>
                <button class="btn-preset" id="btn-preset">🎲 Preset</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="scene-container">
                <canvas id="three-canvas"></canvas>
            </div>

            <div class="graph-container">
                <h3>📈 Grafik Kecepatan terhadap Waktu (v-t)</h3>
                <canvas id="graph-vt"></canvas>
            </div>

            <div class="graph-container">
                <h3>📉 Grafik Posisi terhadap Waktu (s-t)</h3>
                <canvas id="graph-st"></canvas>
                <div class="legend">
                    <div class="legend-item">
                        <div class="legend-color" style="background:#00d4ff"></div>
                        <span>Kecepatan (v)</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background:#ff00ff"></div>
                        <span>Posisi (s)</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Three.js -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ========== State & DOM ==========
        const state = {
            v0: 10,
            a: 2,
            T: 10,
            t: 0,
            isPlaying: false,
            speed: 1,
            trail: []
        };

        const $ = id => document.getElementById(id);
        const sliderV0 = $('slider-v0');
        const sliderA = $('slider-a');
        const sliderT = $('slider-T');
        const valV0 = $('val-v0');
        const valA = $('val-a');
        const valT = $('val-T');
        const infoT = $('info-t');
        const infoS = $('info-s');
        const infoV = $('info-v');

        // ========== Three.js Scene ==========
        const canvas = $('three-canvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        scene.fog = new THREE.Fog(0x0a0a1a, 50, 200);

        const camera = new THREE.PerspectiveCamera(60, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
        camera.position.set(30, 25, 40);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        const controls = new OrbitControls(camera, canvas);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2.1;
        controls.minDistance = 10;
        controls.maxDistance = 100;

        // Lighting
        const ambient = new THREE.AmbientLight(0x404060, 0.6);
        scene.add(ambient);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(20, 30, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.left = -50;
        dirLight.shadow.camera.right = 50;
        dirLight.shadow.camera.top = 50;
        dirLight.shadow.camera.bottom = -50;
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0x00d4ff, 1, 50);
        pointLight.position.set(0, 10, 0);
        scene.add(pointLight);

        // Ground / Track
        const trackLength = 100;
        const trackGeometry = new THREE.PlaneGeometry(trackLength, 4);
        const trackMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x1a1a2e, 
            metalness: 0.3, 
            roughness: 0.7 
        });
        const track = new THREE.Mesh(trackGeometry, trackMaterial);
        track.rotation.x = -Math.PI / 2;
        track.receiveShadow = true;
        scene.add(track);

        // Track lines (markers)
        const markerMaterial = new THREE.MeshBasicMaterial({ color: 0x00d4ff });
        for (let i = -50; i <= 50; i += 5) {
            const marker = new THREE.Mesh(
                new THREE.BoxGeometry(0.1, 0.05, 3),
                markerMaterial
            );
            marker.position.set(i, 0.03, 0);
            scene.add(marker);

            const numLabel = createTextSprite(i.toString());
            numLabel.position.set(i, 1, 2);
            scene.add(numLabel);
        }

        // Grid
        const grid = new THREE.GridHelper(100, 40, 0x00d4ff, 0x222244);
        grid.position.y = 0.01;
        grid.material.opacity = 0.3;
        grid.material.transparent = true;
        scene.add(grid);

        // Object (Car-like)
        const objectGroup = new THREE.Group();
        
        // Body
        const bodyGeometry = new THREE.BoxGeometry(3, 1, 1.8);
        const bodyMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xff00ff, 
            metalness: 0.7, 
            roughness: 0.2,
            emissive: 0x440044,
            emissiveIntensity: 0.3
        });
        const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
        body.position.y = 0.8;
        body.castShadow = true;
        objectGroup.add(body);

        // Cabin
        const cabinGeometry = new THREE.BoxGeometry(1.5, 0.8, 1.6);
        const cabinMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x00d4ff, 
            metalness: 0.5, 
            roughness: 0.1,
            transparent: true,
            opacity: 0.7
        });
        const cabin = new THREE.Mesh(cabinGeometry, cabinMaterial);
        cabin.position.set(-0.2, 1.6, 0);
        cabin.castShadow = true;
        objectGroup.add(cabin);

        // Wheels
        const wheelGeometry = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
        const wheelMaterial = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8, roughness: 0.2 });
        const wheelPositions = [[-1, 0.4, 0.9], [-1, 0.4, -0.9], [1, 0.4, 0.9], [1, 0.4, -0.9]];
        const wheels = [];
        wheelPositions.forEach(pos => {
            const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
            wheel.position.set(...pos);
            wheel.rotation.x = Math.PI / 2;
            wheel.castShadow = true;
            objectGroup.add(wheel);
            wheels.push(wheel);
        });

        // Trail (line)
        const trailMaxPoints = 200;
        const trailGeometry = new THREE.BufferGeometry();
        const trailPositions = new Float32Array(trailMaxPoints * 3);
        trailGeometry.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
        const trailMaterial = new THREE.LineBasicMaterial({ 
            color: 0xff00ff, 
            transparent: true, 
            opacity: 0.8 
        });
        const trail = new THREE.Line(trailGeometry, trailMaterial);
        scene.add(trail);

        // Velocity vector arrow
        const arrowHelper = new THREE.ArrowHelper(
            new THREE.Vector3(1, 0, 0),
            new THREE.Vector3(0, 0, 0),
            5,
            0x00ff88,
            1,
            0.5
        );
        scene.add(arrowHelper);

        scene.add(objectGroup);

        // Helper function for text sprites
        function createTextSprite(text) {
            const canvasEl = document.createElement('canvas');
            canvasEl.width = 128;
            canvasEl.height = 64;
            const ctx = canvasEl.getContext('2d');
            ctx.fillStyle = 'rgba(0,0,0,0)';
            ctx.fillRect(0, 0, 128, 64);
            ctx.font = 'Bold 32px Arial';
            ctx.fillStyle = '#00d4ff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 64, 32);
            
            const texture = new THREE.CanvasTexture(canvasEl);
            const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(material);
            sprite.scale.set(2, 1, 1);
            return sprite;
        }

        // ========== Physics ==========
        function getPosition(t) {
            return state.v0 * t + 0.5 * state.a * t * t;
        }

        function getVelocity(t) {
            return state.v0 + state.a * t;
        }

        function updateObject() {
            const s = getPosition(state.t);
            const v = getVelocity(state.t);
            
            objectGroup.position.x = s;
            objectGroup.position.y = 0;
            
            // Rotate wheels based on velocity
            const wheelSpeed = v * 0.1;
            wheels.forEach(w => {
                w.rotation.y += wheelSpeed;
            });
            
            // Update velocity arrow
            const arrowLength = Math.min(Math.abs(v), 10) * 0.5;
            arrowHelper.position.set(s, 2.5, 0);
            const dir = v >= 0 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(-1, 0, 0);
            arrowHelper.setDirection(dir);
            arrowHelper.setLength(Math.max(arrowLength, 0.5), 0.6, 0.3);
            arrowHelper.setColor(v >= 0 ? 0x00ff88 : 0xff3366);

            // Update trail
            state.trail.push(s);
            if (state.trail.length > trailMaxPoints) state.trail.shift();
            
            for (let i = 0; i < trailMaxPoints; i++) {
                const idx = i * 3;
                if (i < state.trail.length) {
                    trailPositions[idx] = state.trail[i];
                    trailPositions[idx + 1] = 0.5;
                    trailPositions[idx + 2] = 0;
                } else {
                    trailPositions[idx] = 0;
                    trailPositions[idx + 1] = 0;
                    trailPositions[idx + 2] = 0;
                }
            }
            trailGeometry.attributes.position.needsUpdate = true;
            trailGeometry.setDrawRange(0, state.trail.length);
            
            // Update info
            infoT.textContent = state.t.toFixed(1) + ' s';
            infoS.textContent = s.toFixed(1) + ' m';
            infoV.textContent = v.toFixed(1) + ' m/s';
        }

        // ========== Graphs (Canvas 2D) ==========
        function drawGraph(canvasId, fn, color, label, isLinear) {
            const c = $(canvasId);
            const ctx = c.getContext('2d');
            const dpr = window.devicePixelRatio;
            c.width = c.clientWidth * dpr;
            c.height = c.clientHeight * dpr;
            ctx.scale(dpr, dpr);
            const w = c.clientWidth;
            const h = c.clientHeight;
            
            ctx.clearRect(0, 0, w, h);
            
            // Background
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(0, 0, w, h);
            
            const padding = { left: 50, right: 20, top: 20, bottom: 30 };
            const plotW = w - padding.left - padding.right;
            const plotH = h - padding.top - padding.bottom;
            
            // Grid
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 10; i++) {
                const x = padding.left + (plotW * i / 10);
                ctx.beginPath();
                ctx.moveTo(x, padding.top);
                ctx.lineTo(x, padding.top + plotH);
                ctx.stroke();
            }
            for (let i = 0; i <= 5; i++) {
                const y = padding.top + (plotH * i / 5);
                ctx.beginPath();
                ctx.moveTo(padding.left, y);
                ctx.lineTo(padding.left + plotW, y);
                ctx.stroke();
            }
            
            // Axes
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(padding.left, padding.top);
            ctx.lineTo(padding.left, padding.top + plotH);
            ctx.lineTo(padding.left + plotW, padding.top + plotH);
            ctx.stroke();
            
            // Labels
            ctx.fillStyle = '#aaa';
            ctx.font = '11px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Waktu (s)', padding.left + plotW/2, h - 5);
            ctx.save();
            ctx.translate(15, padding.top + plotH/2);
            ctx.rotate(-Math.PI/2);
            ctx.fillText(label, 0, 0);
            ctx.restore();
            
            // Find min/max for scaling
            const steps = 100;
            const values = [];
            for (let i = 0; i <= steps; i++) {
                values.push(fn(i * state.T / steps));
            }
            const maxV = Math.max(...values, 1);
            const minV = Math.min(...values, 0);
            const range = maxV - minV || 1;
            
            // Draw curve
            ctx.strokeStyle = color;
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            for (let i = 0; i <= steps; i++) {
                const t = i * state.T / steps;
                const v = fn(t);
                const x = padding.left + (t / state.T) * plotW;
                const y = padding.top + plotH - ((v - minV) / range) * plotH;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            
            // Current point
            const ct = state.t;
            const cv = fn(ct);
            const cx = padding.left + (ct / state.T) * plotW;
            const cy = padding.top + plotH - ((cv - minV) / range) * plotH;
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(cx, cy, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(cx, cy, 7, 0, Math.PI * 2);
            ctx.stroke();
            
            // Y-axis labels
            ctx.fillStyle = '#aaa';
            ctx.font = '10px Arial';
            ctx.textAlign = 'right';
            for (let i = 0; i <= 5; i++) {
                const val = minV + (range * (5 - i) / 5);
                const y = padding.top + (plotH * i / 5);
                ctx.fillText(val.toFixed(1), padding.left - 5, y + 3);
            }
            // X-axis labels
            ctx.textAlign = 'center';
            for (let i = 0; i <= 5; i++) {
                const val = (state.T * i / 5).toFixed(0);
                const x = padding.left + (plotW * i / 5);
                ctx.fillText(val, x, padding.top + plotH + 15);
            }
        }

        function updateGraphs() {
            drawGraph('graph-vt', t => getVelocity(t), '#00d4ff', 'Kecepatan (m/s)');
            drawGraph('graph-st', t => getPosition(t), '#ff00ff', 'Posisi (m)');
        }

        // ========== Animation Loop ==========
        let lastTime = 0;
        function animate(currentTime) {
            requestAnimationFrame(animate);
            
            const deltaTime = (currentTime - lastTime) / 1000;
            lastTime = currentTime;
            
            if (state.isPlaying) {
                state.t += deltaTime * state.speed;
                if (state.t >= state.T) {
                    state.t = state.T;
                    state.isPlaying = false;
                    $('btn-play').textContent = '▶ Replay';
                }
            }
            
            updateObject();
            updateGraphs();
            controls.update();
            renderer.render(scene, camera);
        }

        // ========== Event Listeners ==========
        sliderV0.addEventListener('input', e => {
            state.v0 = parseFloat(e.target.value);
            valV0.textContent = state.v0;
            state.t = 0;
            state.trail = [];
        });

        sliderA.addEventListener('input', e => {
            state.a = parseFloat(e.target.value);
            valA.textContent = state.a;
            state.t = 0;
            state.trail = [];
        });

        sliderT.addEventListener('input', e => {
            state.T = parseFloat(e.target.value);
            valT.textContent = state.T;
            if (state.t > state.T) state.t = state.T;
        });

        $('btn-play').addEventListener('click', () => {
            if (state.t >= state.T) {
                state.t = 0;
                state.trail = [];
            }
            state.isPlaying = true;
            $('btn-play').textContent = '▶ Play';
        });

        $('btn-pause').addEventListener('click', () => {
            state.isPlaying = false;
        });

        $('btn-reset').addEventListener('click', () => {
            state.t = 0;
            state.isPlaying = false;
            state.trail = [];
            $('btn-play').textContent = '▶ Play';
        });

        $('btn-preset').addEventListener('click', () => {
            const presets = [
                { v0: 0, a: 5, T: 10 },
                { v0: 10, a: 0, T: 10 },
                { v0: 15, a: -1, T: 20 },
                { v0: -5, a: 2, T: 10 }
            ];
            const p = presets[Math.floor(Math.random() * presets.length)];
            state.v0 = p.v0;
            state.a = p.a;
            state.T = p.T;
            state.t = 0;
            state.trail = [];
            sliderV0.value = p.v0;
            sliderA.value = p.a;
            sliderT.value = p.T;
            valV0.textContent = p.v0;
            valA.textContent = p.a;
            valT.textContent = p.T;
        });

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = canvas.clientWidth / canvas.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
        });

        // Start
        requestAnimationFrame(animate);
    </script>
</body>
</html>
