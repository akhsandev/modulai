<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUARA KAREBA SMANSA</title>
    
    <!-- Meta Tags untuk Preview WhatsApp & Sosial Media -->
    <meta property="og:title" content="SUARA KAREBA SMANSA" />
    <meta property="og:description" content="Dengarkan siaran langsung Radio SMAN 1 Soppeng. Ikuti live chat, titip salam, dan request lagu favoritmu sekarang!" />
    <meta property="og:image" content="https://arafx.vercel.app/logo.png" />
    <meta property="og:type" content="website" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter untuk kesan minimalis dan profesional -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #2c313a; /* Warna dasar Slate Dark Grey */
            color: #e2e8f0; 
            overflow-x: hidden;
        }

        /* Elemen Timbul Dark Mode */
        .neu-flat {
            background: #2c313a;
            box-shadow: 8px 8px 16px #1d2127, 
                       -8px -8px 16px #3b414d;
        }

        /* Elemen Tenggelam Dark Mode */
        .neu-pressed {
            background: #2c313a;
            box-shadow: inset 6px 6px 10px #1d2127, 
                        inset -6px -6px 10px #3b414d;
        }

        /* Tombol & Interaksi */
        .neu-button { transition: all 0.2s ease-in-out; }
        .neu-button:active {
            box-shadow: inset 4px 4px 8px #1d2127, 
                        inset -4px -4px 8px #3b414d;
            transform: scale(0.98);
        }

        /* Input Form Dark Mode */
        .neu-input {
            background: #2c313a;
            box-shadow: inset 4px 4px 8px #1d2127, 
                        inset -4px -4px 8px #3b414d;
            border: none;
            outline: none;
            transition: all 0.2s ease;
            color: #e2e8f0;
        }
        .neu-input:focus {
            box-shadow: inset 6px 6px 10px #1d2127, 
                        inset -6px -6px 10px #3b414d;
        }

        /* Marquee Text (Teks Berjalan) */
        .marquee-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            padding: 4px 0;
            mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
        }
        .marquee-content {
            display: inline-block;
            animation: marquee 15s linear infinite;
        }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        /* Animasi Putar Cover Album */
        .spin-slow { animation: spin 8s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* Sembunyikan Scrollbar tapi tetap bisa di-scroll */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Fix Widget Centova Cast Umum */
        a.cc_streaminfo { text-decoration: none; color: inherit; pointer-events: none; }

        /* ========================================== */
        /* STYLING KHUSUS RECENT TRACKS CENTOVA CAST  */
        /* ========================================== */
        .cc_recenttracks_list { width: 100%; font-size: 11px; color: #94a3b8; text-align: left; }
        .cc_recenttracks_list table { width: 100%; border-collapse: collapse; }
        .cc_recenttracks_list td { padding: 6px 0; border-bottom: 1px solid #3b414d; }
        .cc_recenttracks_list tr:last-child td { border-bottom: none; } /* Hilangkan garis di item terakhir */
        .cc_recenttracks_list a { color: #e2e8f0; font-weight: 600; text-decoration: none; pointer-events: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-[100dvh] py-6 px-4 relative">

    <!-- KONTAINER UTAMA -->
    <div class="max-w-md w-full flex flex-col items-center justify-center">

        <!-- ========================================== -->
        <!-- KONTROL RADIO & RECENT TRACKS              -->
        <!-- ========================================== -->
        <div class="neu-flat rounded-[32px] p-5 sm:p-8 w-full flex flex-col items-center justify-center">
            
            <!-- Cover Album Putar (Diperkecil di HP) -->
            <div class="neu-flat rounded-full p-1.5 sm:p-2 mb-4 sm:mb-8 w-36 h-36 sm:w-56 sm:h-56 flex items-center justify-center relative shrink-0">
                <!-- Efek Gelombang Memancar dari luar CD -->
                <div class="absolute inset-0 rounded-full border border-cyan-400 animate-ping opacity-30 pointer-events-none"></div>
                <!-- Inti Lampu Neon (Steady Glow) di luar -->
                <div class="absolute inset-0 rounded-full shadow-[0_0_20px_2px_rgba(34,211,238,0.4)] pointer-events-none"></div>
                
                <!-- Cover Album Tampil Utuh (Tanpa Lubang & Tanpa Sisa Putih) -->
                <div class="neu-pressed rounded-full w-full h-full overflow-hidden flex items-center justify-center bg-[#2c313a]">
                    <img src="https://arafx.vercel.app/logo.png" class="cc_streaminfo w-full h-full object-cover rounded-full transition-all duration-500" data-type="trackimageurl" data-username="karebasoppeng" alt="Cover Album" id="albumArt" onerror="this.src='https://arafx.vercel.app/logo.png'">
                </div>
            </div>

            <h1 class="text-xl sm:text-2xl font-bold text-gray-200 tracking-wide text-center uppercase">SUARA KAREBA</h1>
            <p class="text-[10px] sm:text-xs font-semibold text-gray-400 tracking-widest mt-1 mb-4 sm:mb-8 uppercase">SMAN 1 SOPPENG</p>

            <!-- Teks Berjalan (Now Playing) -->
            <div class="w-full neu-pressed rounded-full px-4 py-2 sm:px-5 sm:py-3 mb-4 sm:mb-8 flex items-center shrink-0">
                <i class="fas fa-music text-cyan-400 text-xs sm:text-sm mr-3 sm:mr-4 animate-pulse"></i>
                <div class="marquee-container text-xs sm:text-sm font-semibold text-gray-300">
                    <div class="marquee-content">
                        <a href="https://c4.siar.us:2199/tunein/karebasoppeng.pls" class="cc_streaminfo" data-type="song" data-username="karebasoppeng">Memuat data lagu...</a>
                    </div>
                </div>
            </div>

            <!-- Audio Player (Tersembunyi) -->
            <audio id="radioStream" src="https://c4.siar.us/proxy/karebasoppeng/stream" crossorigin="anonymous" preload="none"></audio>

            <!-- Kontrol Player & Stats -->
            <div class="flex items-center justify-between w-full px-2 mb-4 sm:mb-6 shrink-0">
                <div class="flex flex-col items-center">
                    <span class="text-[9px] sm:text-[10px] text-gray-400 font-bold uppercase tracking-wider">Pendengar</span>
                    <span class="cc_streaminfo text-xs sm:text-sm font-bold text-cyan-400 mt-1" data-type="listeners" data-username="karebasoppeng">0</span>
                </div>
                
                <!-- Tombol Play (Ukurannya disesuaikan) -->
                <button id="playBtn" class="neu-flat neu-button w-16 h-16 sm:w-20 sm:h-20 rounded-full flex items-center justify-center text-cyan-400 cursor-pointer mx-2 sm:mx-4 transition-colors duration-300">
                    <i class="fas fa-play text-xl sm:text-2xl ml-1" id="playIcon"></i>
                </button>

                <div class="flex flex-col items-center">
                    <span class="text-[9px] sm:text-[10px] text-gray-400 font-bold uppercase tracking-wider">Status</span>
                    <span class="cc_streaminfo text-xs sm:text-sm font-bold text-cyan-400 mt-1 uppercase" data-type="server" data-username="karebasoppeng">-</span>
                </div>
            </div>

            <!-- RIWAYAT LAGU (RECENT TRACKS) -->
            <div class="w-full mt-1 pt-4 sm:pt-6 border-t border-[#3b414d] shrink-0">
                <h3 class="text-[9px] sm:text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2 sm:mb-3 flex items-center justify-center">
                    <i class="fas fa-history mr-2 text-cyan-400"></i> Riwayat Putaran
                </h3>
                <!-- Ketinggian riwayat putaran disesuaikan untuk HP -->
                <div class="neu-pressed w-full h-24 sm:h-32 rounded-2xl p-3 sm:p-4 overflow-y-auto no-scrollbar">
                    <div class="cc_recenttracks_list" data-username="karebasoppeng">
                        <div class="text-center text-[10px] sm:text-xs text-gray-500 italic mt-6">Memuat riwayat...</div>
                    </div>
                </div>
            </div>

        </div>
    </div> <!-- Akhir dari Kontainer Utama -->

    <!-- ========================================== -->
    <!-- TOMBOL FLOATING CHAT (FAB)                 -->
    <!-- ========================================== -->
    <button id="chatFab" class="fixed bottom-6 right-6 sm:bottom-10 sm:right-10 w-14 h-14 sm:w-16 sm:h-16 neu-flat rounded-full flex items-center justify-center text-cyan-400 z-[60] hover:text-cyan-300 transition-all duration-300 cursor-pointer hover:scale-105 active:scale-95 group">
        <i class="fas fa-comment-dots text-xl sm:text-2xl group-hover:animate-bounce"></i>
        <span class="absolute top-1 right-1 w-3 h-3 sm:w-4 sm:h-4 bg-red-500 rounded-full animate-pulse border-2 border-[#2c313a]"></span>
        
        <!-- Hint Text Ceria -->
        <div id="chatHint" class="absolute right-full mr-4 w-max bg-[#1d2127]/80 backdrop-blur-sm border border-[#3b414d] text-gray-300 text-[10px] sm:text-xs px-3 py-2 sm:px-4 sm:py-2.5 rounded-2xl shadow-lg pointer-events-none flex flex-col items-end animate-[bounce_2s_infinite] transition-opacity duration-300">
            <span>Request lagu? Kirim pesan?</span>
            <span class="text-cyan-400 font-bold mt-0.5">Klik di sini yah! <i class="fas fa-arrow-right ml-1"></i></span>
        </div>
    </button>

    <!-- ========================================== -->
    <!-- FLOATING LIVE CHAT & REQUEST               -->
    <!-- ========================================== -->
    <div id="floatingChatContainer" class="fixed bottom-24 right-6 sm:bottom-32 sm:right-10 w-[85vw] sm:w-[400px] h-[500px] max-h-[75vh] neu-flat rounded-[32px] p-5 sm:p-6 flex flex-col z-50 transition-all duration-300 transform scale-0 opacity-0 pointer-events-none origin-bottom-right">
        
        <!-- Header Chat -->
        <div class="w-full flex items-center justify-between mb-4 sm:mb-6 px-2 border-b border-[#3b414d] pb-3 sm:pb-4 shrink-0">
            <h2 class="text-xs sm:text-sm font-bold text-gray-300 tracking-wide uppercase"><i class="fas fa-comments text-cyan-400 mr-2"></i> Live Chat SMANSA</h2>
            <div class="flex items-center gap-3 sm:gap-4">
                <span class="text-[9px] sm:text-[10px] text-cyan-400 font-bold tracking-widest uppercase animate-pulse flex items-center">
                    <span class="w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full bg-cyan-400 mr-1.5 sm:mr-2"></span>Online
                </span>
                <button id="closeChatBtn" class="text-gray-400 hover:text-red-400 transition-colors cursor-pointer text-base sm:text-lg">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>

        <!-- Kotak Riwayat Pesan -->
        <div id="chatBox" class="neu-pressed w-full flex-1 min-h-0 rounded-2xl p-4 sm:p-5 mb-4 sm:mb-6 overflow-y-auto no-scrollbar flex flex-col gap-3 sm:gap-4 relative">
            <p id="loadingChat" class="text-[10px] sm:text-xs text-center text-gray-400 font-semibold italic my-auto">Menyambungkan ke studio...</p>
            <!-- Balon chat akan muncul di sini via JS -->
        </div>

        <!-- Form Kirim Pesan -->
        <div class="w-full flex flex-col gap-2 sm:gap-3 shrink-0">
            <input type="text" id="inputNama" maxlength="25" placeholder="Namata' (Cth: Ara X.10)" class="neu-input w-full rounded-xl px-3 py-2.5 sm:px-4 sm:py-3 text-[10px] sm:text-xs font-semibold placeholder-gray-400" />
            <div class="flex gap-2 sm:gap-3">
                <input type="text" id="inputPesan" maxlength="150" placeholder="Ketik pesan/request..." class="neu-input w-full rounded-xl px-3 py-2.5 sm:px-4 sm:py-3 text-[10px] sm:text-xs placeholder-gray-400" />
                <button id="btnKirim" class="neu-flat neu-button px-4 sm:px-5 rounded-xl text-cyan-400 flex items-center justify-center cursor-pointer hover:text-cyan-300 transition-colors">
                    <i class="fas fa-paper-plane text-base sm:text-lg"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Script Widget Centova Cast Utama & Recent Tracks -->
    <script language="javascript" type="text/javascript" src="https://c4.siar.us:2199/system/streaminfo.js"></script>
    <script language="javascript" type="text/javascript" src="https://c4.siar.us:2199/system/recenttracks.js"></script>

    <!-- LOGIKA UI RADIO & FLOATING CHAT -->
    <script>
        // --- LOGIKA FLOATING CHAT ---
        const chatFab = document.getElementById('chatFab');
        const floatingChatContainer = document.getElementById('floatingChatContainer');
        const closeChatBtn = document.getElementById('closeChatBtn');
        const chatBoxUi = document.getElementById('chatBox');
        const chatHint = document.getElementById('chatHint');

        function toggleChat() {
            const isClosed = floatingChatContainer.classList.contains('scale-0');
            if (isClosed) {
                // Animasi Buka Chat
                floatingChatContainer.classList.remove('scale-0', 'opacity-0', 'pointer-events-none');
                floatingChatContainer.classList.add('scale-100', 'opacity-100', 'pointer-events-auto');
                
                // Hilangkan dot merah di FAB dan Sembunyikan Hint selamanya
                const notifDot = chatFab.querySelector('span.bg-red-500');
                if (notifDot) notifDot.classList.add('hidden');
                if (chatHint) chatHint.classList.add('opacity-0', 'hidden'); 
                
                // Pastikan scroll langsung ke paling bawah saat dibuka
                setTimeout(() => { chatBoxUi.scrollTop = chatBoxUi.scrollHeight; }, 100);
            } else {
                // Animasi Tutup Chat
                floatingChatContainer.classList.add('scale-0', 'opacity-0', 'pointer-events-none');
                floatingChatContainer.classList.remove('scale-100', 'opacity-100', 'pointer-events-auto');
            }
        }

        chatFab.addEventListener('click', toggleChat);
        closeChatBtn.addEventListener('click', toggleChat);

        // --- LOGIKA AUDIO PLAYER ---
        const audio = document.getElementById('radioStream');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const albumArt = document.getElementById('albumArt');

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playIcon.classList.remove('fa-play', 'ml-1');
                playIcon.classList.add('fa-pause');
                albumArt.classList.add('spin-slow');
                playBtn.classList.add('text-cyan-300');
            } else {
                audio.pause();
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play', 'ml-1');
                albumArt.classList.remove('spin-slow');
                playBtn.classList.remove('text-cyan-300');
            }
        });
    </script>

    <!-- LOGIKA FIREBASE LIVE CHAT (Type Module) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAyopuyvzjIXIZT-LE8_7bVP8vxVIlcQtU",
            authDomain: "apps-f1563.firebaseapp.com",
            projectId: "apps-f1563",
            storageBucket: "apps-f1563.firebasestorage.app",
            messagingSenderId: "330620144262",
            appId: "1:330620144262:web:8ad8a32685b352ec0edf07",
            measurementId: "G-TRS9JGPPX0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const chatCol = collection(db, 'kareba_chats');

        const chatBox = document.getElementById('chatBox');
        const inputNama = document.getElementById('inputNama');
        const inputPesan = document.getElementById('inputPesan');
        const btnKirim = document.getElementById('btnKirim');
        const loadingChat = document.getElementById('loadingChat');
        
        let isFirstLoad = true;

        async function autoCleanupOldChats() {
            const thirtyDaysAgo = Date.now() - (30 * 24 * 60 * 60 * 1000);
            try {
                const snapshot = await getDocs(chatCol);
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if (data.timestamp < thirtyDaysAgo) {
                        deleteDoc(doc(db, 'kareba_chats', docSnap.id));
                    }
                });
            } catch (error) {
                console.log("Cleanup error: ", error);
            }
        }
        autoCleanupOldChats();

        onSnapshot(chatCol, (snapshot) => {
            if (isFirstLoad && loadingChat) {
                loadingChat.remove();
                isFirstLoad = false;
            }

            const messages = [];
            snapshot.forEach((doc) => {
                messages.push({ id: doc.id, ...doc.data() });
            });
            messages.sort((a, b) => a.timestamp - b.timestamp);

            chatBox.innerHTML = '';

            messages.forEach((data) => {
                const timeString = new Date(data.timestamp).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                const chatBubble = document.createElement('div');
                chatBubble.className = "bg-[#2c313a] border border-[#3b414d] shadow-[2px_2px_5px_#1d2127,-2px_-2px_5px_#3b414d] rounded-xl p-3 sm:p-4 text-left animate-[fadeIn_0.3s_ease-out]";
                chatBubble.innerHTML = `
                    <div class="flex justify-between items-baseline mb-1.5 sm:mb-2">
                        <span class="text-[10px] sm:text-xs font-bold text-cyan-400">${data.nama}</span>
                        <span class="text-[9px] sm:text-[10px] text-gray-400 font-semibold">${timeString}</span>
                    </div>
                    <p class="text-[10px] sm:text-xs text-gray-200 break-words leading-relaxed">${data.pesan}</p>
                `;
                chatBox.appendChild(chatBubble);
            });
            
            setTimeout(() => {
                chatBox.scrollTop = chatBox.scrollHeight;
                const chatContainer = document.getElementById('floatingChatContainer');
                const notifDot = document.querySelector('#chatFab span');
                if (chatContainer.classList.contains('scale-0') && notifDot) {
                    notifDot.classList.remove('hidden');
                }
            }, 50);

        }, (error) => {
            console.error("Error mengambil chat: ", error);
        });

        async function kirimPesan() {
            const nama = inputNama.value.trim();
            const pesan = inputPesan.value.trim();

            if (nama === '' || pesan === '') {
                alert("Hei! Jangan lupa isi Nama dan Pesan/Request kamu ya!");
                return;
            }
            if (nama.length > 25) {
                alert("Nama terlalu panjang! Maksimal 25 karakter ya.");
                return;
            }
            if (pesan.length > 150) {
                alert("Pesan terlalu panjang! Maksimal 150 karakter ya.");
                return;
            }

            try {
                await addDoc(chatCol, {
                    nama: nama,
                    pesan: pesan,
                    timestamp: Date.now()
                });
                inputPesan.value = '';
                inputPesan.focus();
            } catch (error) {
                console.error("Gagal mengirim pesan: ", error);
                alert("Waduh, pesan gagal terkirim. Pastikan tidak ada karakter terlarang ya!");
            }
        }

        btnKirim.addEventListener('click', kirimPesan);
        inputPesan.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                kirimPesan();
            }
        });
    </script>
</body>
</html>
