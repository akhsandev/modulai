<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUARA KAREBA SMANSA</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter untuk kesan minimalis dan profesional -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #2c313a; /* Warna dasar baru: Slate Dark Grey yang lebih terang agar Neumorphism menonjol */
            color: #e2e8f0; 
            overflow-x: hidden;
        }

        /* Elemen Timbul Dark Mode (Outset Shadow) */
        .neu-flat {
            background: #2c313a;
            box-shadow: 8px 8px 16px #1d2127, 
                       -8px -8px 16px #3b414d;
        }

        /* Elemen Tenggelam Dark Mode (Inset Shadow) */
        .neu-pressed {
            background: #2c313a;
            box-shadow: inset 6px 6px 10px #1d2127, 
                        inset -6px -6px 10px #3b414d;
        }

        /* Tombol & Interaksi */
        .neu-button { transition: all 0.2s ease-in-out; }
        .neu-button:active {
            box-shadow: inset 4px 4px 8px #1d2127, 
                        inset -4px -4px 8px #3b414d;
            transform: scale(0.98);
        }

        /* Input Form Dark Mode */
        .neu-input {
            background: #2c313a;
            box-shadow: inset 4px 4px 8px #1d2127, 
                        inset -4px -4px 8px #3b414d;
            border: none;
            outline: none;
            transition: all 0.2s ease;
            color: #e2e8f0;
        }
        .neu-input:focus {
            box-shadow: inset 6px 6px 10px #1d2127, 
                        inset -6px -6px 10px #3b414d;
        }

        /* Marquee Text (Teks Berjalan) */
        .marquee-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            padding: 4px 0;
            mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
        }
        .marquee-content {
            display: inline-block;
            animation: marquee 15s linear infinite;
        }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        /* Animasi Putar Cover Album */
        .spin-slow { animation: spin 8s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* Sembunyikan Scrollbar di Chat Box tapi tetap bisa di-scroll */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Fix Widget Centova Cast */
        a.cc_streaminfo { text-decoration: none; color: inherit; pointer-events: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen py-10 px-4">

    <!-- KONTAINER GRID UTAMA (Membagi 2 kolom di layar besar) -->
    <div class="max-w-5xl w-full grid grid-cols-1 md:grid-cols-2 gap-8 items-stretch">

        <!-- ========================================== -->
        <!-- KOLOM 1: KONTROL RADIO                     -->
        <!-- ========================================== -->
        <div class="neu-flat rounded-[32px] p-8 w-full flex flex-col items-center justify-center">
            
            <!-- Cover Album Putar -->
            <div class="neu-flat rounded-full p-2 mb-8 w-56 h-56 flex items-center justify-center relative">
                <!-- Lubang tengah piringan hitam -->
                <div class="absolute w-10 h-10 bg-[#2c313a] rounded-full z-10 neu-flat pointer-events-none"></div>
                <div class="neu-pressed rounded-full w-full h-full overflow-hidden flex items-center justify-center p-1">
                    <img src="https://arafx.vercel.app/logo.png" class="cc_streaminfo w-full h-full object-cover rounded-full transition-all duration-500" data-type="trackimageurl" data-username="karebasoppeng" alt="Cover Album" id="albumArt" onerror="this.src='https://arafx.vercel.app/logo.png'">
                </div>
            </div>

            <h1 class="text-2xl font-bold text-gray-200 tracking-wide text-center uppercase">SUARA KAREBA</h1>
            <p class="text-xs font-semibold text-gray-400 tracking-widest mt-1 mb-8 uppercase">SMAN 1 SOPPENG</p>

            <!-- Teks Berjalan (Now Playing) -->
            <div class="w-full neu-pressed rounded-full px-5 py-3 mb-8 flex items-center">
                <i class="fas fa-music text-cyan-400 text-sm mr-4 animate-pulse"></i>
                <div class="marquee-container text-sm font-semibold text-gray-300">
                    <div class="marquee-content">
                        <a href="https://c4.siar.us:2199/tunein/karebasoppeng.pls" class="cc_streaminfo" data-type="song" data-username="karebasoppeng">Memuat data lagu...</a>
                    </div>
                </div>
            </div>

            <!-- Audio Player (Tersembunyi) -->
            <audio id="radioStream" src="https://c4.siar.us/proxy/karebasoppeng/stream" crossorigin="anonymous" preload="none"></audio>

            <!-- Kontrol Player & Stats -->
            <div class="flex items-center justify-between w-full px-2">
                <div class="flex flex-col items-center">
                    <span class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Pendengar</span>
                    <span class="cc_streaminfo text-sm font-bold text-cyan-400 mt-1" data-type="listeners" data-username="karebasoppeng">0</span>
                </div>
                
                <!-- Tombol Play -->
                <button id="playBtn" class="neu-flat neu-button w-24 h-24 rounded-full flex items-center justify-center text-cyan-400 cursor-pointer mx-4 transition-colors duration-300">
                    <i class="fas fa-play text-3xl ml-1" id="playIcon"></i>
                </button>
                
                <div class="flex flex-col items-center">
                    <span class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Status</span>
                    <span class="cc_streaminfo text-sm font-bold text-cyan-400 mt-1 uppercase" data-type="server" data-username="karebasoppeng">-</span>
                </div>
            </div>
        </div>


        <!-- ========================================== -->
        <!-- KOLOM 2: LIVE CHAT & REQUEST               -->
        <!-- ========================================== -->
        <div class="neu-flat rounded-[32px] p-8 w-full flex flex-col h-[600px]">
            
            <!-- Header Chat -->
            <div class="w-full flex items-center justify-between mb-6 px-2 border-b border-[#3b414d] pb-4 shrink-0">
                <h2 class="text-sm font-bold text-gray-300 tracking-wide uppercase"><i class="fas fa-comments text-cyan-400 mr-2"></i> Live Chat SMANSA</h2>
                <span class="text-[10px] text-cyan-400 font-bold tracking-widest uppercase animate-pulse flex items-center">
                    <span class="w-2 h-2 rounded-full bg-cyan-400 mr-2"></span>Online
                </span>
            </div>

            <!-- Kotak Riwayat Pesan -->
            <div id="chatBox" class="neu-pressed w-full flex-1 min-h-0 rounded-2xl p-5 mb-6 overflow-y-auto no-scrollbar flex flex-col gap-4 relative">
                <p id="loadingChat" class="text-xs text-center text-gray-400 font-semibold italic my-auto">Menyambungkan ke studio...</p>
                <!-- Balon chat akan muncul di sini via JS -->
            </div>

            <!-- Form Kirim Pesan -->
            <div class="w-full flex flex-col gap-4 shrink-0">
                <input type="text" id="inputNama" maxlength="25" placeholder="Namata' (Cth: Ara X.10)" class="neu-input w-full rounded-xl px-5 py-3.5 text-xs font-semibold placeholder-gray-400" />
                <div class="flex gap-4">
                    <input type="text" id="inputPesan" maxlength="150" placeholder="Pesan atau Request Lagu..." class="neu-input w-full rounded-xl px-5 py-3.5 text-xs placeholder-gray-400" />
                    <button id="btnKirim" class="neu-flat neu-button px-6 rounded-xl text-cyan-400 flex items-center justify-center cursor-pointer hover:text-cyan-300 transition-colors">
                        <i class="fas fa-paper-plane text-lg"></i>
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- Script Centova Cast -->
    <script language="javascript" type="text/javascript" src="https://c4.siar.us:2199/system/streaminfo.js"></script>

    <!-- LOGIKA UI RADIO -->
    <script>
        const audio = document.getElementById('radioStream');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const albumArt = document.getElementById('albumArt');

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playIcon.classList.remove('fa-play', 'ml-1');
                playIcon.classList.add('fa-pause');
                albumArt.classList.add('spin-slow');
                playBtn.classList.add('text-cyan-300'); // Sedikit lebih terang saat dimainkan
            } else {
                audio.pause();
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play', 'ml-1');
                albumArt.classList.remove('spin-slow');
                playBtn.classList.remove('text-cyan-300');
            }
        });
    </script>

    <!-- LOGIKA FIREBASE LIVE CHAT (Type Module) -->
    <script type="module">
        // Menggunakan library khusus FIRESTORE, bukan Realtime DB
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Config dari Bapak
        const firebaseConfig = {
            apiKey: "AIzaSyAyopuyvzjIXIZT-LE8_7bVP8vxVIlcQtU",
            authDomain: "apps-f1563.firebaseapp.com",
            projectId: "apps-f1563",
            storageBucket: "apps-f1563.firebasestorage.app",
            messagingSenderId: "330620144262",
            appId: "1:330620144262:web:8ad8a32685b352ec0edf07",
            measurementId: "G-TRS9JGPPX0"
        };

        // Inisialisasi Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const chatCol = collection(db, 'kareba_chats');

        const chatBox = document.getElementById('chatBox');
        const inputNama = document.getElementById('inputNama');
        const inputPesan = document.getElementById('inputPesan');
        const btnKirim = document.getElementById('btnKirim');
        const loadingChat = document.getElementById('loadingChat');
        
        let isFirstLoad = true;

        // FUNGSI 1: Cleanup Otomatis (30 Hari) dengan Firestore
        async function autoCleanupOldChats() {
            const thirtyDaysAgo = Date.now() - (30 * 24 * 60 * 60 * 1000);
            
            try {
                const snapshot = await getDocs(chatCol);
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if (data.timestamp < thirtyDaysAgo) {
                        deleteDoc(doc(db, 'kareba_chats', docSnap.id));
                    }
                });
            } catch (error) {
                console.log("Cleanup error: ", error);
            }
        }
        autoCleanupOldChats();

        // FUNGSI 2: Menampilkan Chat Realtime (Firestore Version)
        onSnapshot(chatCol, (snapshot) => {
            if (isFirstLoad && loadingChat) {
                loadingChat.remove(); // Hapus teks loading
                isFirstLoad = false;
            }

            // Ambil semua pesan dan urutkan berdasarkan waktu paling lama ke terbaru
            const messages = [];
            snapshot.forEach((doc) => {
                messages.push({ id: doc.id, ...doc.data() });
            });
            messages.sort((a, b) => a.timestamp - b.timestamp);

            // Bersihkan kotak agar tidak dobel
            chatBox.innerHTML = '';

            messages.forEach((data) => {
                const timeString = new Date(data.timestamp).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                
                const chatBubble = document.createElement('div');
                // Menggunakan kombinasi warna Neumorphism yang baru
                chatBubble.className = "bg-[#2c313a] border border-[#3b414d] shadow-[2px_2px_5px_#1d2127,-2px_-2px_5px_#3b414d] rounded-xl p-4 text-left animate-[fadeIn_0.3s_ease-out]";
                chatBubble.innerHTML = `
                    <div class="flex justify-between items-baseline mb-2">
                        <span class="text-xs font-bold text-cyan-400">${data.nama}</span>
                        <span class="text-[10px] text-gray-400 font-semibold">${timeString}</span>
                    </div>
                    <p class="text-xs text-gray-200 break-words leading-relaxed">${data.pesan}</p>
                `;
                chatBox.appendChild(chatBubble);
            });
            
            // Trik Ajaib: Beri sedikit jeda agar browser selesai merender balon chat,
            // barulah kita perintahkan untuk scroll ke paling bawah! 🚀
            setTimeout(() => {
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 50);

        }, (error) => {
            console.error("Error mengambil chat: ", error);
        });

        // FUNGSI 3: Kirim Chat ke Firestore (menyesuaikan Rules)
        async function kirimPesan() {
            const nama = inputNama.value.trim();
            const pesan = inputPesan.value.trim();

            if (nama === '' || pesan === '') {
                alert("Hei! Jangan lupa isi Nama dan Pesan/Request kamu ya!");
                return;
            }
            
            // Validasi karakter sebelum dikirim agar sesuai dengan Rules Bapak
            if (nama.length > 25) {
                alert("Nama terlalu panjang! Maksimal 25 karakter ya.");
                return;
            }
            if (pesan.length > 150) {
                alert("Pesan terlalu panjang! Maksimal 150 karakter ya.");
                return;
            }

            try {
                // Mengirim dokumen ke Firestore
                await addDoc(chatCol, {
                    nama: nama,
                    pesan: pesan,
                    timestamp: Date.now()
                });
                
                inputPesan.value = '';
                inputPesan.focus();
            } catch (error) {
                console.error("Gagal mengirim pesan: ", error);
                alert("Waduh, pesan gagal terkirim. Pastikan tidak ada karakter terlarang ya!");
            }
        }

        btnKirim.addEventListener('click', kirimPesan);
        inputPesan.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                kirimPesan();
            }
        });
    </script>
</body>
</html>
