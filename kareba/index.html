<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio SMAN 1 Soppeng</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            font-family: 'Orbitron', sans-serif; 
            background: #050510; 
            color: white; 
            /* Ubah agar bisa di-scroll saat form request terbuka di HP */
            overflow-x: hidden; 
        }
        
        /* Efek Glassmorphism */
        .glass { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(15px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        
        .neon-text { text-shadow: 0 0 10px #0ea5e9, 0 0 20px #0ea5e9; }
        .neon-border { box-shadow: 0 0 15px #0ea5e9, inset 0 0 10px #0ea5e9; }
        
        .blob { position: absolute; filter: blur(90px); z-index: -1; opacity: 0.5; animation: float 10s infinite ease-in-out; }
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.1); }
        }

        .bar { width: 8px; background: #0ea5e9; border-radius: 4px; animation: bounce 1s infinite alternate; box-shadow: 0 0 10px #0ea5e9; }
        .bar:nth-child(1) { animation-delay: 0.1s; }
        .bar:nth-child(2) { animation-delay: 0.3s; }
        .bar:nth-child(3) { animation-delay: 0.5s; }
        .bar:nth-child(4) { animation-delay: 0.2s; }
        .bar:nth-child(5) { animation-delay: 0.4s; }
        @keyframes bounce { 0% { height: 10px; } 100% { height: 50px; } }
        
        .paused .bar { animation-play-state: paused; height: 10px; }
        
        .pulse-logo { animation: pulseGlow 2s infinite; }
        @keyframes pulseGlow { 
            0% { filter: drop-shadow(0 0 5px #0ea5e9); transform: scale(1); } 
            50% { filter: drop-shadow(0 0 25px #38bdf8); transform: scale(1.05); } 
            100% { filter: drop-shadow(0 0 5px #0ea5e9); transform: scale(1); } 
        }

        /* Menyembunyikan link agar tidak merusak desain dari Centova */
        a.cc_streaminfo { text-decoration: none; color: inherit; pointer-events: none; }
        
        /* Styling tambahan untuk hasil form request */
        div[data-type="result"] { margin-bottom: 10px; font-size: 11px; text-align: center; font-weight: bold; color: #4ade80; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen relative py-10">
    
    <div class="blob bg-blue-600 w-96 h-96 rounded-full top-0 left-0 fixed"></div>
    <div class="blob bg-purple-600 w-96 h-96 rounded-full bottom-0 right-0 fixed" style="animation-delay: 2s;"></div>

    <div class="glass p-8 rounded-3xl w-full max-w-md text-center flex flex-col items-center relative z-10">
        
        <img src="https://arafx.vercel.app/logo.png" alt="Logo SMAN 1 Soppeng" class="w-32 h-32 mb-4 pulse-logo object-contain" id="radioLogo" style="animation-play-state: paused;">

        <h1 class="text-2xl font-bold neon-text mb-1 uppercase">SMANSA Radio</h1>
        <p class="text-xs text-gray-300 mb-6 tracking-widest font-sans">SMAN 1 SOPPENG MENGUDARA</p>

        <div class="flex items-end justify-center gap-2 h-14 mb-6 w-full" id="visualizer">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>

        <audio id="radioStream" src="https://c4.siar.us/proxy/karebasoppeng/stream" crossorigin="anonymous" preload="none"></audio>

        <div class="flex items-center justify-center gap-8 w-full mb-6">
            <button id="playBtn" class="w-20 h-20 rounded-full bg-transparent border-2 border-[#0ea5e9] hover:bg-[#0ea5e9] hover:bg-opacity-20 neon-border flex items-center justify-center transition-all duration-300 transform hover:scale-105 cursor-pointer">
                <i class="fas fa-play text-3xl text-[#0ea5e9] ml-1" id="playIcon"></i>
            </button>
        </div>
        
        <div class="w-full bg-black bg-opacity-40 rounded-xl p-4 border border-gray-700 mb-4">
            <div class="mb-3 border-b border-gray-600 pb-3">
                <p class="text-[10px] text-gray-400 uppercase tracking-widest mb-1"><i class="fas fa-music mr-1"></i> Sedang Diputar</p>
                <div class="text-sm font-bold text-white truncate w-full neon-text">
                    <a href="https://c4.siar.us:2199/tunein/karebasoppeng.pls" class="cc_streaminfo" data-type="song" data-username="karebasoppeng">Memuat data...</a>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2 text-[10px] font-sans text-gray-300 text-left">
                <div>
                    <i class="fas fa-users text-[#0ea5e9] mr-1"></i> Pendengar: 
                    <span class="cc_streaminfo font-bold text-white" data-type="listeners" data-username="karebasoppeng">0</span>
                </div>
                <div>
                    <i class="fas fa-broadcast-tower text-[#0ea5e9] mr-1"></i> Status: 
                    <span class="cc_streaminfo font-bold text-white" data-type="server" data-username="karebasoppeng">-</span>
                </div>
            </div>
        </div>

        <button id="toggleRequestBtn" class="w-full py-2.5 border border-[#0ea5e9] text-[#0ea5e9] rounded-xl hover:bg-[#0ea5e9] hover:text-white transition-all text-xs font-bold uppercase tracking-widest flex items-center justify-center">
            <i class="fas fa-paper-plane mr-2"></i> Titip Salam & Request Lagu
        </button>

        <div id="requestFormContainer" class="hidden w-full mt-4 bg-black bg-opacity-60 rounded-xl p-4 border border-gray-700 text-left transition-all duration-300">
            <form class="cc_request_form flex flex-col gap-3 font-sans" data-username="karebasoppeng">
                <div data-type="result"></div>
                
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] text-gray-400 mb-1">Nama Penyanyi</label>
                        <input type="text" name="request[artist]" maxlength="127" class="w-full bg-transparent border border-gray-600 rounded px-2 py-1.5 text-white focus:outline-none focus:border-[#0ea5e9] focus:shadow-[0_0_8px_#0ea5e9] transition-all text-xs" />
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-400 mb-1">Judul Lagu</label>
                        <input type="text" name="request[title]" maxlength="127" class="w-full bg-transparent border border-gray-600 rounded px-2 py-1.5 text-white focus:outline-none focus:border-[#0ea5e9] focus:shadow-[0_0_8px_#0ea5e9] transition-all text-xs" />
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] text-gray-400 mb-1">Pesan / Dedikasi Untuk</label>
                    <input type="text" name="request[dedication]" maxlength="127" class="w-full bg-transparent border border-gray-600 rounded px-2 py-1.5 text-white focus:outline-none focus:border-[#0ea5e9] focus:shadow-[0_0_8px_#0ea5e9] transition-all text-xs" placeholder="Misal: Semangat ya yang lagi belajar OSN Fisika!" />
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] text-gray-400 mb-1">Nama Kamu</label>
                        <input type="text" name="request[sender]" maxlength="127" class="w-full bg-transparent border border-gray-600 rounded px-2 py-1.5 text-white focus:outline-none focus:border-[#0ea5e9] focus:shadow-[0_0_8px_#0ea5e9] transition-all text-xs" />
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-400 mb-1">E-mail</label>
                        <input type="email" name="request[email]" maxlength="127" class="w-full bg-transparent border border-gray-600 rounded px-2 py-1.5 text-white focus:outline-none focus:border-[#0ea5e9] focus:shadow-[0_0_8px_#0ea5e9] transition-all text-xs" />
                    </div>
                </div>

                <input type="button" value="Kirim Request" data-type="submit" class="mt-2 w-full py-2 bg-[#0ea5e9] bg-opacity-20 border border-[#0ea5e9] text-[#0ea5e9] rounded hover:bg-[#0ea5e9] hover:text-white hover:shadow-[0_0_15px_#0ea5e9] transition-all text-xs font-bold uppercase cursor-pointer" />
            </form>
        </div>

    </div>

    <script language="javascript" type="text/javascript" src="https://c4.siar.us:2199/system/streaminfo.js"></script>
    <script language="javascript" type="text/javascript" src="https://c4.siar.us:2199/system/request.js"></script>

    <script>
        // Logika Audio
        const audio = document.getElementById('radioStream');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const visualizer = document.getElementById('visualizer');
        const logo = document.getElementById('radioLogo');

        visualizer.classList.add('paused');

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playIcon.classList.remove('fa-play', 'ml-1');
                playIcon.classList.add('fa-pause');
                visualizer.classList.remove('paused');
                logo.style.animationPlayState = 'running';
            } else {
                audio.pause();
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play', 'ml-1');
                visualizer.classList.add('paused');
                logo.style.animationPlayState = 'paused';
            }
        });

        // Logika Toggle Form Request
        const toggleRequestBtn = document.getElementById('toggleRequestBtn');
        const requestFormContainer = document.getElementById('requestFormContainer');

        toggleRequestBtn.addEventListener('click', () => {
            requestFormContainer.classList.toggle('hidden');
            // Sedikit mengubah teks tombol saat dibuka/ditutup
            if (requestFormContainer.classList.contains('hidden')) {
                toggleRequestBtn.innerHTML = '<i class="fas fa-paper-plane mr-2"></i> Titip Salam & Request Lagu';
            } else {
                toggleRequestBtn.innerHTML = '<i class="fas fa-times mr-2"></i> Tutup Form Request';
            }
        });
    </script>
</body>
</html>
