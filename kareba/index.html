<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUARA KAREBA SMANSA</title>
    
    <!-- Meta Tags untuk Preview WhatsApp & Sosial Media -->
    <meta property="og:title" content="SUARA KAREBA SMANSA" />
    <meta property="og:description" content="Dengarkan siaran langsung Radio SMAN 1 Soppeng. Ikuti live chat, titip salam, dan request lagu favoritmu sekarang!" />
    <meta property="og:image" content="https://arafx.vercel.app/logo.png" />
    <meta property="og:type" content="website" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter untuk kesan minimalis dan profesional -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #2c313a; /* Warna dasar Slate Dark Grey */
            color: #e2e8f0; 
            overflow-x: hidden;
            overscroll-behavior-y: none; /* Mencegah pull-to-refresh di HP agar terasa seperti aplikasi asli */
        }

        /* Elemen Timbul Dark Mode */
        .neu-flat {
            background: #2c313a;
            box-shadow: 8px 8px 16px #1d2127, 
                       -8px -8px 16px #3b414d;
        }

        /* Elemen Tenggelam Dark Mode */
        .neu-pressed {
            background: #2c313a;
            box-shadow: inset 6px 6px 10px #1d2127, 
                        inset -6px -6px 10px #3b414d;
        }

        /* Tombol & Interaksi */
        .neu-button { transition: all 0.2s ease-in-out; }
        .neu-button:active {
            box-shadow: inset 4px 4px 8px #1d2127, 
                        inset -4px -4px 8px #3b414d;
            transform: scale(0.95);
        }

        /* Input Form Dark Mode */
        .neu-input {
            background: #2c313a;
            box-shadow: inset 4px 4px 8px #1d2127, 
                        inset -4px -4px 8px #3b414d;
            border: none;
            outline: none;
            transition: all 0.2s ease;
            color: #e2e8f0;
        }
        .neu-input:focus {
            box-shadow: inset 6px 6px 10px #1d2127, 
                        inset -6px -6px 10px #3b414d;
        }

        /* Styling Khusus Slider Volume Neumorphism */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
            width: 100%;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #2c313a;
            box-shadow: 2px 2px 4px #1d2127, -2px -2px 4px #3b414d;
            cursor: pointer;
            margin-top: -5px; 
            border: 2px solid #22d3ee; /* Aksen Cyan */
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #2c313a;
            border-radius: 2px;
            box-shadow: inset 2px 2px 4px #1d2127, inset -2px -2px 4px #3b414d;
        }

        /* Marquee Text (Teks Berjalan) */
        .marquee-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            padding: 2px 0;
            mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
        }
        .marquee-content {
            display: inline-block;
            animation: marquee 15s linear infinite;
        }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        /* Animasi Putar Cover Album */
        .spin-slow { animation: spin 8s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* Animasi Audio Visualizer (Equalizer) */
        @keyframes eqBounce {
            0% { height: 3px; }
            100% { height: 14px; }
        }

        /* Animasi Balon Hati Melayang */
        @keyframes floatUp {
            0% { transform: translate(0, 0) scale(0.8); opacity: 1; }
            80% { opacity: 0.8; }
            100% { transform: translate(var(--tx), -120px) scale(1.5) rotate(15deg); opacity: 0; }
        }

        /* Sembunyikan Scrollbar tapi tetap bisa di-scroll */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Fix Widget Centova Cast Umum */
        a.cc_streaminfo { text-decoration: none; color: inherit; pointer-events: none; }

        /* ========================================== */
        /* KUNCI KHUSUS AGAR RECENT TRACKS TIDAK BOCOR */
        /* ========================================== */
        .cc_recenttracks_list { width: 100%; font-size: 10px; color: #94a3b8; text-align: left; overflow: hidden; }
        @media (min-width: 640px) { .cc_recenttracks_list { font-size: 11px; } }
        /* Paksa lebar tabel agar tidak melampaui layar (table-layout: fixed) */
        .cc_recenttracks_list table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .cc_recenttracks_list td { padding: 4px 0; border-bottom: 1px solid #3b414d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; }
        /* Atur ukuran kolom gambar agar tidak menguasai tempat */
        .cc_recenttracks_list td:first-child { width: 36px; padding-right: 6px; } 
        .cc_recenttracks_list img { width: 30px; height: 30px; min-width: 30px; border-radius: 4px; object-fit: cover; }
        .cc_recenttracks_list tr:last-child td { border-bottom: none; }
        .cc_recenttracks_list a { color: #e2e8f0; font-weight: 600; text-decoration: none; pointer-events: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-[100dvh] py-4 sm:py-6 px-4 relative">

    <!-- LOGIKA UI (Radio, Fitur Baru & Floating Chat) -->
    <script>
        // --- LOGIKA AUDIO PLAYER & VISUALIZER ---
        const audio = document.getElementById('radioStream');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const albumArt = document.getElementById('albumArt');
        
        const visualizer = document.getElementById('visualizer');
        const musicIconStatic = document.getElementById('musicIconStatic');
        const glowRing1 = document.getElementById('glowRing1');
        const glowRing2 = document.getElementById('glowRing2');

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playIcon.classList.remove('fa-play', 'ml-1');
                playIcon.classList.add('fa-pause');
                albumArt.classList.add('spin-slow');
                playBtn.classList.add('text-cyan-300');
                
                // Nyalakan Visualizer & Glow Effect
                musicIconStatic.classList.add('hidden');
                visualizer.classList.remove('hidden');
                glowRing1.classList.remove('opacity-0');
                glowRing1.classList.add('animate-ping');
                glowRing2.classList.remove('opacity-0');
            } else {
                audio.pause();
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play', 'ml-1');
                albumArt.classList.remove('spin-slow');
                playBtn.classList.remove('text-cyan-300');
                
                // Matikan Visualizer & Glow Effect
                visualizer.classList.add('hidden');
                musicIconStatic.classList.remove('hidden');
                glowRing1.classList.add('opacity-0');
                glowRing1.classList.remove('animate-ping');
                glowRing2.classList.add('opacity-0');
            }
        });

        // --- FITUR 1: SLIDER VOLUME ---
        const volumeSlider = document.getElementById('volumeSlider');
        const volIconMax = document.getElementById('volIconMax');
        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
            // Ubah warna ikon mengikuti besaran volume
            if(e.target.value == 0) volIconMax.className = "fas fa-volume-mute text-gray-500 text-[10px]";
            else if(e.target.value < 0.5) volIconMax.className = "fas fa-volume-down text-cyan-600 text-[10px]";
            else volIconMax.className = "fas fa-volume-up text-cyan-400 text-[10px]";
        });

        // --- FITUR 2: TOMBOL HATI (LOVE ANIMATION) ---
        const btnHeart = document.getElementById('btnHeart');
        btnHeart.addEventListener('click', function() {
            // Membuat elemen ikon hati baru
            const heart = document.createElement('i');
            heart.className = 'fas fa-heart text-red-500 absolute text-sm sm:text-base pointer-events-none z-50';
            
            // Memberikan variasi arah terbang (kiri/kanan sedikit)
            const randomX = (Math.random() - 0.5) * 60; // Geser antara -30px sampai 30px
            heart.style.setProperty('--tx', `${randomX}px`);
            heart.style.animation = `floatUp 1.2s ease-out forwards`;
            
            this.appendChild(heart);
            
            // Efek klik pada tombol (merah sekejap)
            this.classList.add('text-red-400');
            setTimeout(() => this.classList.remove('text-red-400'), 200);

            // Hapus elemen hati dari HTML setelah animasi selesai agar tidak menumpuk
            setTimeout(() => heart.remove(), 1200);
        });

        // --- FITUR 4: TOMBOL SHARE (BAGIKAN) ---
        const btnShare = document.getElementById('btnShare');
        btnShare.addEventListener('click', () => {
            if (navigator.share) {
                navigator.share({
                    title: 'Radio SUARA KAREBA SMANSA',
                    text: 'Yuk dengerin siaran langsung Radio SMAN 1 Soppeng! Bisa request lagu dan titip salam lho. 📻🎧',
                    url: window.location.href,
                }).catch(console.error);
            } else {
                // Fallback jika browser tidak support Web Share API (misal di PC/Laptop lama)
                const waText = encodeURIComponent(`Yuk dengerin siaran langsung Radio SMANSA! Bisa request lagu lho: ${window.location.href}`);
                window.open(`https://api.whatsapp.com/send?text=${waText}`, '_blank');
            }
        });

        // --- LOGIKA FLOATING CHAT ---
        const chatFab = document.getElementById('chatFab');
        const floatingChatContainer = document.getElementById('floatingChatContainer');
        const closeChatBtn = document.getElementById('closeChatBtn');
        const chatBoxUi = document.getElementById('chatBox');
        const chatHint = document.getElementById('chatHint');

        function toggleChat() {
            const isClosed = floatingChatContainer.classList.contains('scale-0');
            if (isClosed) {
                floatingChatContainer.classList.remove('scale-0', 'opacity-0', 'pointer-events-none');
                floatingChatContainer.classList.add('scale-100', 'opacity-100', 'pointer-events-auto');
                
                const notifDot = chatFab.querySelector('span.bg-red-500');
                if (notifDot) notifDot.classList.add('hidden');
                if (chatHint) chatHint.classList.add('opacity-0', 'hidden'); 
                
                setTimeout(() => { chatBoxUi.scrollTop = chatBoxUi.scrollHeight; }, 100);
            } else {
                floatingChatContainer.classList.add('scale-0', 'opacity-0', 'pointer-events-none');
                floatingChatContainer.classList.remove('scale-100', 'opacity-100', 'pointer-events-auto');
            }
        }
        chatFab.addEventListener('click', toggleChat);
        closeChatBtn.addEventListener('click', toggleChat);
    </script>

    <!-- LOGIKA FIREBASE LIVE CHAT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAyopuyvzjIXIZT-LE8_7bVP8vxVIlcQtU",
            authDomain: "apps-f1563.firebaseapp.com",
            projectId: "apps-f1563",
            storageBucket: "apps-f1563.firebasestorage.app",
            messagingSenderId: "330620144262",
            appId: "1:330620144262:web:8ad8a32685b352ec0edf07",
            measurementId: "G-TRS9JGPPX0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const chatCol = collection(db, 'kareba_chats');

        const chatBox = document.getElementById('chatBox');
        const inputNama = document.getElementById('inputNama');
        const inputPesan = document.getElementById('inputPesan');
        const btnKirim = document.getElementById('btnKirim');
        const loadingChat = document.getElementById('loadingChat');
        
        let isFirstLoad = true;

        async function autoCleanupOldChats() {
            const thirtyDaysAgo = Date.now() - (30 * 24 * 60 * 60 * 1000);
            try {
                const snapshot = await getDocs(chatCol);
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if (data.timestamp < thirtyDaysAgo) {
                        deleteDoc(doc(db, 'kareba_chats', docSnap.id));
                    }
                });
            } catch (error) {
                console.log("Cleanup error: ", error);
            }
        }
        autoCleanupOldChats();

        onSnapshot(chatCol, (snapshot) => {
            if (isFirstLoad && loadingChat) {
                loadingChat.remove();
                isFirstLoad = false;
            }

            const messages = [];
            snapshot.forEach((doc) => {
                messages.push({ id: doc.id, ...doc.data() });
            });
            messages.sort((a, b) => a.timestamp - b.timestamp);

            chatBox.innerHTML = '';

            messages.forEach((data) => {
                const timeString = new Date(data.timestamp).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                const chatBubble = document.createElement('div');
                chatBubble.className = "bg-[#2c313a] border border-[#3b414d] shadow-[2px_2px_5px_#1d2127,-2px_-2px_5px_#3b414d] rounded-xl p-3 sm:p-4 text-left animate-[fadeIn_0.3s_ease-out]";
                chatBubble.innerHTML = `
                    <div class="flex justify-between items-baseline mb-1.5 sm:mb-2">
                        <span class="text-[10px] sm:text-xs font-bold text-cyan-400">${data.nama}</span>
                        <span class="text-[9px] sm:text-[10px] text-gray-400 font-semibold">${timeString}</span>
                    </div>
                    <p class="text-[10px] sm:text-xs text-gray-200 break-words leading-relaxed">${data.pesan}</p>
                `;
                chatBox.appendChild(chatBubble);
            });
            
            setTimeout(() => {
                chatBox.scrollTop = chatBox.scrollHeight;
                const chatContainer = document.getElementById('floatingChatContainer');
                const notifDot = document.querySelector('#chatFab span');
                if (chatContainer.classList.contains('scale-0') && notifDot) {
                    notifDot.classList.remove('hidden');
                }
            }, 50);

        }, (error) => {
            console.error("Error mengambil chat: ", error);
        });

        async function kirimPesan() {
            const nama = inputNama.value.trim();
            const pesan = inputPesan.value.trim();

            if (nama === '' || pesan === '') {
                alert("Hei! Jangan lupa isi Nama dan Pesan/Request kamu ya!");
                return;
            }
            if (nama.length > 25) {
                alert("Nama terlalu panjang! Maksimal 25 karakter ya.");
                return;
            }
            if (pesan.length > 150) {
                alert("Pesan terlalu panjang! Maksimal 150 karakter ya.");
                return;
            }

            try {
                await addDoc(chatCol, {
                    nama: nama,
                    pesan: pesan,
                    timestamp: Date.now()
                });
                inputPesan.value = '';
                inputPesan.focus();
            } catch (error) {
                console.error("Gagal mengirim pesan: ", error);
                alert("Waduh, pesan gagal terkirim. Pastikan tidak ada karakter terlarang ya!");
            }
        }

        btnKirim.addEventListener('click', kirimPesan);
        inputPesan.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                kirimPesan();
            }
        });
    </script>
</body>
</html>
